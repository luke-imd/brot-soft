# Synology Container Manager → Projekt → Erstellen → diese Datei verwenden.
# Das Image baut GitHub bei jedem Push auf main (.github/workflows/docker.yml); die NAS lädt es nur.
services:
  garage:
    image: ghcr.io/luke-imd/brot-soft:latest
    container_name: garage
    restart: unless-stopped
    ports:
      - "3000:3000"            # NAS-Port:Container-Port; davor hängt der DSM-Reverse-Proxy (HTTPS)
    volumes:
      - ./data:/data           # SQLite-Datenbank — dieser Ordner ist das Backup
    env_file: .env
